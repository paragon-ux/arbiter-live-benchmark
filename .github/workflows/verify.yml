name: verify

on:
  push:
  pull_request:

concurrency:
  group: arbiter-live-benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22.x]
    steps:
      - name: Check out Arbiter sibling dependency
        uses: actions/checkout@v4
        with:
          repository: paragon-ux/Arbiter
          ref: 6149c9a8991cc46587213c04ad1e56863c42e549
          path: Arbiter

      - name: Check out Waymark sibling dependency
        uses: actions/checkout@v4
        with:
          repository: paragon-ux/waymark
          ref: 8c077a0fee896d4ebe9f8c83b11e026c1bb6702f
          path: waymark

      - name: Check out live benchmark source
        uses: actions/checkout@v4
        with:
          path: arbiter-live-benchmark

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Build Arbiter sibling
        working-directory: Arbiter
        run: |
          npm ci
          npm run build

      - name: Build Waymark sibling
        working-directory: waymark
        run: |
          npm ci
          npm run build

      - name: Install benchmark from lockfile
        working-directory: arbiter-live-benchmark
        run: npm ci

      - name: Configure Git identity for tests
        working-directory: arbiter-live-benchmark
        run: |
          git config --global user.name "CI Agent"
          git config --global user.email "ci@arbiter.local"

      - name: Verify build, tests, release benchmark, and public hygiene
        working-directory: arbiter-live-benchmark
        env:
          WAYMARK_CLI_PATH: ${{ github.workspace }}/waymark/dist/src/cli.js
        run: npm run verify:release
        timeout-minutes: 30

      - name: Check native test coverage
        working-directory: arbiter-live-benchmark
        env:
          WAYMARK_CLI_PATH: ${{ github.workspace }}/waymark/dist/src/cli.js
        run: npm run test:coverage
        timeout-minutes: 30
